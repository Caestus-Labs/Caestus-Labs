<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>caestus labs</title>
  <meta name="description" content="We’re building the physical layer of computing, because the future deserves much more than better rectangles.">
  <link rel="icon" type="image/svg+xml" href="/assets/logo/caestus-mark-favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/assets/logo/caestus-mark-black.svg">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
      background: #fff;
    }

    body {
      margin: 0;
      padding: clamp(24px, 5vw, 64px);
      font-size: 16px;
      line-height: 1.5;
    }

    h1 {
      margin: 0 0 24px;
      font-size: 20px;
      font-weight: 600;
      line-height: 1.3;
    }

    p {
      margin: 0;
    }

    .contact {
      margin-top: 24px;
    }

    a {
      color: inherit;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    a:hover {
      text-decoration: none;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Caestus Labs</h1>
    <p>We’re building the physical layer of computing, because the future deserves much more than better rectangles.</p>
    <p class="contact"><a href="mailto:contact@caestuslabs.com">contact@caestuslabs.com</a></p>
  </main>
</body>
</html>
